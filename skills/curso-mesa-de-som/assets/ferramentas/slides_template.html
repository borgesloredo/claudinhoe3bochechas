function answer(btn) {   // 1 tentativa: a escolha revela a certa e TRAVA o quiz até R / saída do slide
  const box = btn.parentElement, s = box.closest('section');
  if (box.classList.contains('locked')) return;
  box.classList.add('locked');
  const ans = +box.dataset.ans, bs = [...box.children], pick = bs.indexOf(btn), ok = bs[ans];
  bs.forEach(b => b.setAttribute('aria-disabled', 'true'));
  $('.reset', s).textContent = 'Tecla R: zerar o quiz';

  const fb = $('.fb', s), txt = b => $('span:nth-child(2)', b).textContent, L = i => 'ABC'[i];
  fb.innerHTML = pick === ans ? `<span class="vd good">Certo, é a ${L(ans)}.</span> ` : `<span class="vd bad">Não é a ${L(pick)}. A certa é a ${L(ans)}.</span> `;
  if (pick !== ans) { const sr = document.createElement('span'); sr.className = 'sr'; sr.textContent = txt(ok) + '. '; fb.append(sr); }
  fb.append(fb.dataset.t);
  const mark = (b, good) => {

    const m = $('.mk', b); m.innerHTML = good ? CHECK : CROSS;
    $('path', m).style.stroke = good ? C.green : C.red;

  };
  if (pick !== ans) {
    mark(btn, false);

  bs.forEach(b => { if (b !== ok && b !== btn) gsap.to(b, { autoAlpha: .6, duration: .3 }); });   // pendência 4.4: 0,45 sumia no fundo da sala
  $$('.fb, .reset', s).forEach((p, i) => { p.hidden = false; gsap.fromTo(p, { autoAlpha: 0, y: RM ? 0 : 10 }, { autoAlpha: 1, y: 0, duration: RM ? .15 : .25, ease: 'power2.out', delay: RM ? 0 : .05 + i * .15 }); });   // rodada 3: o feedback chega em até 0,3 s

const flow = {
  init(s) {

      const x = +b.dataset.x, y = +b.dataset.y; let best = 0, bd = 1e9;
      pts.forEach(([px, py], i) => { const d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = i / 800; } });
      b.dataset.p = best;
    });
    const fader = $('.blk[data-k="fader"]', s); this.blks.find(b => b.classList.contains('send')).dataset.p = fader.dataset.p;
    this.pos = 0; this.in0 = $('.sfpanel .in', s).innerHTML;   // texto inicial do painel ("Clique em um bloco…"), para a reentrada
  },
  leds(upTo) { this.blks.forEach(b => gsap.to($('.led1', b), { autoAlpha: +b.dataset.p <= upTo + .001 ? 1 : 0, duration: .15 })); },
  enter(s, tl) {
    const order = [...this.blks].sort((a, b) => a.dataset.p - b.dataset.p).concat($('.pa', s));
    gsap.set($$('.led1', s), { autoAlpha: 0 }); gsap.set(this.dot, { autoAlpha: 0 });
    const pin = $('.sfpanel .in', s); gsap.killTweensOf([pin, ...$$('.halo, .box', s)]); pin.innerHTML = this.in0; gsap.set(pin, { autoAlpha: 1, y: 0 });   // reentrada: sem bloco escolhido
    this.blks.forEach(b => b.classList.remove('on')); gsap.set([...$$('.halo', s), ...$$('.box', s)], { clearProps: 'opacity,visibility,transform' }); this.pos = 0;
    tl.add(rise($('.kicker', s), 12), 0).add(titleIn($('h3', s)), .04).add(rise($$('.legend span', s), 10), .3)
      .fromTo(this.path, { drawSVG: '0%' }, { drawSVG: '100%', duration: 1.4, ease: 'power2.inOut' }, .1)
      .fromTo(order, { autoAlpha: .3, scale: .94, transformOrigin: '50% 50%' }, { autoAlpha: 1, scale: 1, duration: .45, stagger: 1.1 / order.length }, .1)
      .fromTo($$('.chev', s), { autoAlpha: 0 }, { autoAlpha: 1, duration: .3, stagger: .05 }, .6)

      .fromTo($('.sfpanel', s), { autoAlpha: .4, y: 12 }, { autoAlpha: 1, y: 0, duration: .5 }, .2)
      .add(this.travel(0, 1, 2.6), 1.8)
      .set(this.dot, { autoAlpha: 1 }, 1.82);   // acende já no trajeto (nunca no canto 0,0)
  },
  travel(a, b, dur) {   // o sinal percorre o fluxo e acende o LED de cada bloco ao passar
    const st = { p: a }, tl = gsap.timeline();

    this.pos = b; return tl;
  },
  pick(blk, s) {
    if (cur?.s === s && cur.tl.isActive()) cur.tl.progress(1);   // clique durante a entrada: a entrada termina antes (os LEDs não ficam todos acesos)
    const p = +blk.dataset.p;
    this.blks.forEach(b => { b.classList.toggle('on', b === blk); gsap.to($('.halo', b), { autoAlpha: b === blk ? .3 : 0, duration: .25 }); });

    if (blk.classList.contains('send')) tl.to(this.dot, { motionPath: { path: this.branch, align: this.branch, alignOrigin: [.5, .5] }, duration: RM ? 0 : .4, ease: 'power2.out' });

      old.innerHTML = `${dv}<b>${esc(blk.dataset.t)}</b>: ${esc(blk.dataset.d)} <a href="#/cap-${blk.dataset.c}">Ver capítulo ${blk.dataset.c} ${ARR}</a>`;

/* ---------- TÓPICO COM DIAGRAMA DO slides_viz.py (os 204 "topic hv") ----------
   O SVG chega com elementos soltos (rect/text/line). Os grupos que cada fragment acende são FAIXAS DE Y:
   ordena os filhos pelo topo do getBBox e junta quem se sobrepõe ou fica a menos de GAP unidades.
   Tópico: cada peça com data-step="k" acende junto com o k-ésimo bullet da seção (o gerador marca isso no slides_viz.py); sem data-step, o desenho é um só e acende na entrada. */

      const isConn = e => e.matches('line, polyline') || (e.matches('path') && getComputedStyle(e).fill === 'none' && !e.matches('.curve, .curve2, .curve3, .curve4'));

    const isLine = e => e.matches('line, polyline') || (e.matches('path') && getComputedStyle(e).fill === 'none');

    if (c.step) tl.add(() => { if (Reveal.getCurrentSlide() === s) c.step(s, Reveal.getIndices().f ?? -1); }, Math.min(.25, tl.duration()));   // f lido NA HORA; rodada 4: aos 250 ms (antes, só no fim da entrada: o diagrama assentava perto de 2,5 s)
  }
  const b = bxOf(s);
  if (b) {
    b.o.enter?.(b.x, tl);
    if (b.o.step) tl.add(() => { if (Reveal.getCurrentSlide() === s) { const f = Reveal.getIndices().f ?? -1; b.o.step(b.x, f + 1, f); } }, Math.min(.25, tl.duration()));

/* selo "Abordagens divergentes": a bifurcação se desenha (tronco e depois os dois ramos) e as opções entram uma a uma, na mesma altura; nenhuma ganha destaque */
function divgIn(el) {
  const p = $$('.dvi path', el), o = $$('.dvo', el);
  gsap.killTweensOf(p.concat(o));
  gsap.timeline().fromTo(p, { drawSVG: '0%' }, { drawSVG: '100%', duration: .32, stagger: .07, ease: 'power2.inOut' }, 0)
    .fromTo(o, { autoAlpha: .2, x: -12 }, { autoAlpha: 1, x: 0, duration: .4, stagger: .09, ease: 'stage' }, .18);
}
function onFragment(e, shown) {
  const s = Reveal.getCurrentSlide(), c = ctrlOf(s), f = Reveal.getIndices().f ?? -1;
  e.fragments.forEach(el => {
    const row = el.classList.contains('trow'), kids = row ? $$(':scope > div', el) : [el];
    const from = row || el.matches(GHOST) ? .2 : 0;   // ghost acende a partir de 0,2
    gsap.killTweensOf(kids);
    if (shown) RM ? gsap.set(kids, { autoAlpha: 1, x: 0, y: 0 }) : gsap.fromTo(kids, { autoAlpha: from, x: row ? -16 : 0, y: !row ? 18 : 0 }, { autoAlpha: 1, x: 0, y: 0, duration: .5 });   // rodada 2: com RM vai direto ao final (fromTo de .2 s deixava as .efrow do s24-2-1 em 0)
    else gsap.set(kids, { clearProps: 'opacity,visibility,transform' });
  });
  if (shown && !RM) e.fragments.forEach(el => el.matches('.divg') && divgIn(el));   // selo de abordagens divergentes: entrada própria
  if (cur?.s === s && cur.tl.isActive()) cur.tl.progress(1);   // 'próximo' logo depois de entrar: a entrada termina primeiro
  if (c?.step && cur?.s === s) c.step(s, f);   // pulo direto para outro slide: o fragment chega antes do slidechanged; a entrada chama step no fim
  if (cur?.s === s) { const b = bxOf(s); b?.o.step?.(b.x, f + 1, f); }   // fora do diag, k = fragments já mostrados (f + 1)
  emit(s, shown ? 'fragment:shown' : 'fragment:hidden', { f, fragments: e.fragments });
}
const ACT = '.opts button, .blk, .gterm, .gtab, .exm';   // elementos que respondem a clique, Enter e Espaço
const act = t => t.matches('.opts button') ? answer(t) : ctrlOf(t.closest('section')).pick(t, t.closest('section'));

Promise.all([
  document.fonts.load('800 60px "Barlow Condensed"'), document.fonts.load('600 28px "Barlow Condensed"'), document.fonts.load('400 28px "Barlow"'),
  document.fonts.load('600 28px "Barlow"'), document.fonts.load('500 18px "JetBrains Mono"'), document.fonts.load('700 18px "JetBrains Mono"')
]).then(() => document.fonts.ready).then(() => document.readyState === 'loading' && new Promise(r => document.addEventListener('DOMContentLoaded', r))).then(() => {   // espera os <script> sob medida do fim do arquivo
  prep();   // medidas com as fontes certas, antes do reveal contar os slides
  return Reveal.initialize({ hash: true, width: 1280, height: 720, margin: 0, center: false, slideNumber: false, progress: false, transition: 'none', backgroundTransition: 'none', plugins: [RevealNotes] });
}).then(() => {
  buildRail();
  $$('.slides section').forEach((s, i) => {
    if (s.querySelector(':scope > section')) return;   // pilha vertical: só agrupa
    if (s.classList.contains('quiz')) decorateQuiz(s);
    const c = Object.create(CTRL[s.dataset.anim] || base); c.uid = i; inst.set(s, c); c.init?.(s);
  });
  if (!RM) $$('.haze i').forEach((h, i) => gsap.to(h, { x: i ? 60 : -80, y: i ? -40 : 50, duration: 16 + i * 5, ease: 'sine.inOut', repeat: -1, yoyo: true }));
  Reveal.on('slidechanged', e => enter(e.currentSlide));
  Reveal.on('fragmentshown', e => onFragment(e, true));
  Reveal.on('fragmenthidden', e => onFragment(e, false));
  enter(Reveal.getCurrentSlide());
  document.addEventListener('click', e => { const t = e.target.closest(ACT); if (t) act(t); });

    } else if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey && !e.altKey) {

});
