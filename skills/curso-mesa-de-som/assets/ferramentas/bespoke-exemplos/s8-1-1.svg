<svg viewBox="0 0 400 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compressor: acima do threshold a saída sobe menos; o ratio inclina a curva; o Gain do compressor devolve o nível; Mix em 0% desliga; detector Peak ou RMS">
<text x="200" y="14" text-anchor="middle" class="vt">Compressor: curva de transferência</text>
<rect x="0" y="0" width="400" height="392" fill="none"/>
<!-- gráfico: entrada (x) × saída (y), −48 a 0 dB; threshold −24 dB -->
<g>
<line x1="46" y1="107.5" x2="276" y2="107.5" class="grid"/><line x1="46" y1="165.0" x2="276" y2="165.0" class="grid"/><line x1="46" y1="222.5" x2="276" y2="222.5" class="grid"/>
<line x1="46" y1="50" x2="46" y2="280" class="axis"/><line x1="46" y1="280" x2="276" y2="280" class="axis"/>
<text x="40" y="55" text-anchor="end" class="sm">0</text><text x="40" y="170.0" text-anchor="end" class="sm">−24</text><text x="40" y="285" text-anchor="end" class="sm">−48</text>
<text x="52" y="40" text-anchor="start" class="sm">saída (dB)</text>
<text x="276" y="320" text-anchor="end" class="sm">entrada →</text>
</g>
<line x1="46" y1="280" x2="276" y2="50" class="curve2"/>
<text x="206" y="72" text-anchor="end" class="sm">1:1 (sem compressão)</text>
<line x1="161.0" y1="50" x2="161.0" y2="280" class="thr"/>
<text x="161.0" y="300" text-anchor="middle" class="lbl">threshold</text>
<!-- curva: trecho de baixo fixo + trecho de cima que gira no threshold (ratio); o grupo sobe com o Gain (makeup) -->
<g class="cv" data-own="">
<line x1="46" y1="280" x2="161" y2="165" class="curve" style="marker-end:none"/>
<line class="cv-up curve" x1="161" y1="165" x2="276" y2="165" style="marker-end:none"/>
</g>
<text class="rt lbl" data-own="" x="56" y="150" text-anchor="start">ratio 4:1</text>
<text class="lim lblr" data-own="" x="56" y="168" text-anchor="start">limitador</text>
<!-- bullet 1: 4 dB na entrada viram 1 na saída -->
<g class="b1m" data-own="">
<text x="56" y="104" text-anchor="start" class="bb" style="fill:var(--accent)">4 dB → 1 dB</text>
</g>
<!-- medidores: mesma escala vertical do gráfico -->
<g>
<rect x="290" y="50" width="24" height="230" rx="2" class="zgr"/><rect x="328" y="50" width="24" height="230" rx="2" class="zgr"/><rect x="366" y="50" width="24" height="230" rx="2" class="zgr"/>
<text x="302" y="300" text-anchor="middle" class="b">IN</text><text x="340" y="300" text-anchor="middle" class="b">OUT</text><text x="378" y="300" text-anchor="middle" class="b">GR</text>
</g>
<g class="mt" data-own="">
<rect class="m-in" x="290" y="50" width="24" height="230" rx="2" style="fill:var(--led-green);fill-opacity:.85"/>
<rect class="m-out" x="328" y="50" width="24" height="230" rx="2" style="fill:var(--led-green);fill-opacity:.85"/>
<rect class="m-gr" x="366" y="50" width="24" height="230" rx="2" style="fill:var(--accent)"/>
<text class="v-in" x="302" y="320" text-anchor="middle" style="font:700 14px var(--f-mono);fill:var(--lamp)">−24</text>
<text class="v-out" x="340" y="320" text-anchor="middle" style="font:700 14px var(--f-mono);fill:var(--lamp)">−24</text>
</g>
<g class="gr-box" data-own="">
<rect x="262" y="0" width="138" height="38" rx="5" class="bxd"/>
<text x="274" y="25" text-anchor="start" class="zl">GR</text>
<text class="gr-v bb" x="390" y="27" text-anchor="end" style="fill:var(--accent)">0 dB</text>
</g>
<!-- ponto na curva e a distância até a reta 1:1 (o que o compressor tirou) -->
<g class="pt" data-own="">
<line class="gap" x1="0" y1="0" x2="0" y2="-100" style="stroke:var(--accent);stroke-width:3;stroke-linecap:round"/>
<circle cx="0" cy="0" r="6.5" style="fill:var(--accent);stroke:var(--bg-1);stroke-width:2.5"/>
</g>
<line x1="0" y1="332" x2="400" y2="332" class="sep"/>
<!-- controles: ganho de entrada (parado), Gain do compressor (makeup) e Mix -->
<g class="kn" data-own="">
<circle cx="18" cy="356" r="13" class="knob"/><line class="kn-n" x1="18" y1="356" x2="18" y2="345" style="stroke:var(--ink-3);stroke-width:3;stroke-linecap:round"/>
<text x="18" y="388" text-anchor="middle" class="sm">ganho</text><text class="kn-v0 sm" x="36" y="361" text-anchor="start">fixo</text>
</g>
<g class="kn" data-own="">
<circle cx="96" cy="356" r="13" class="knob"/><line class="kn-n needle" x1="96" y1="356" x2="96" y2="345"/>
<text x="96" y="388" text-anchor="middle" class="sm">Gain</text><text class="kn-v" x="113" y="361" text-anchor="start" style="font:700 14px var(--f-mono);fill:var(--lamp)">+0 dB</text>
</g>
<g class="kn" data-own="">
<circle cx="186" cy="356" r="13" class="knob"/><line class="kn-n needle" x1="186" y1="356" x2="186" y2="345"/>
<text x="186" y="388" text-anchor="middle" class="sm">Mix</text><text class="kn-v" x="203" y="361" text-anchor="start" style="font:700 14px var(--f-mono);fill:var(--lamp)">100%</text>
</g>
<!-- detector: a mesma entrada vista pelo Peak (segue o golpe) e pelo RMS (envoltória lenta) -->
<g class="det" data-own="">
<g class="det-w"><rect x="253.5" y="353.6" width="3" height="32.4" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="259.5" y="365.4" width="3" height="20.6" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="265.5" y="371.8" width="3" height="14.2" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="271.5" y="374.3" width="3" height="11.7" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="277.5" y="376.5" width="3" height="9.5" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="283.5" y="378.2" width="3" height="7.8" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="289.5" y="354.9" width="3" height="31.1" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="295.5" y="364.4" width="3" height="21.6" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="301.5" y="372.0" width="3" height="14.0" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="307.5" y="374.9" width="3" height="11.1" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="313.5" y="376.1" width="3" height="9.9" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="319.5" y="377.8" width="3" height="8.2" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="325.5" y="350.0" width="3" height="36.0" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="331.5" y="365.6" width="3" height="20.4" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="337.5" y="371.2" width="3" height="14.8" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="343.5" y="375.0" width="3" height="11.0" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="349.5" y="376.5" width="3" height="9.5" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="355.5" y="377.5" width="3" height="8.5" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="361.5" y="351.9" width="3" height="34.1" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="367.5" y="364.7" width="3" height="21.3" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="373.5" y="371.1" width="3" height="14.9" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="379.5" y="375.2" width="3" height="10.8" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="385.5" y="376.3" width="3" height="9.7" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="391.5" y="377.7" width="3" height="8.3" rx="1" style="fill:var(--ink-3);opacity:.55"/><rect x="397.5" y="353.2" width="3" height="32.8" rx="1" style="fill:var(--ink-3);opacity:.55"/></g>
<path class="det-pk" d="M255 351.6 L261 363.4 L267 369.8 L273 372.3 L279 374.5 L285 376.2 L291 352.9 L297 362.4 L303 370.0 L309 372.9 L315 374.1 L321 375.8 L327 348.0 L333 363.6 L339 369.2 L345 373.0 L351 374.5 L357 375.5 L363 349.9 L369 362.7 L375 369.1 L381 373.2 L387 374.3 L393 375.7 L399 351.2" style="fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round"/>
<path class="det-rm" d="M255 346.5 L261 353.8 L267 359.0 L273 362.3 L279 364.9 L285 366.9 L291 367.2 L297 367.0 L303 367.1 L309 367.2 L315 367.1 L321 367.0 L327 366.0 L333 366.2 L339 366.1 L345 366.1 L351 366.2 L357 366.1 L363 366.5 L369 366.3 L375 366.3 L381 366.3 L387 366.3 L393 366.4 L399 366.6" style="fill:none;stroke:var(--x32);stroke-width:2.6;stroke-linejoin:round"/>
<text class="det-l" x="254" y="346" text-anchor="start" style="font:700 14px var(--f-mono);fill:var(--accent)">PEAK</text>
<text class="det-l" x="304" y="346" text-anchor="start" style="font:700 14px var(--f-mono);fill:var(--x32)">RMS</text>
</g>
</svg>
